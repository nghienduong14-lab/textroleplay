  if (!aiReady()) return null;
  const fn = (prompt, opts) => aiCall(prompt, opts);
  fn.json = async (prompt, opts) => {
    const o = Object.assign({}, opts, {json:true});
    let r = await aiCall(prompt, o);
    try { return parseJSONLoose(r.text); }
    catch(e){ r = await aiCall(prompt + '\n\n(Lần trước bạn trả lời sai định dạng. Lần này chỉ trả về JSON hợp lệ.)', o); return parseJSONLoose(r.text); }
  };
  fn.limits = async () => ({images:{maxCount:4, mediaTypes:['image/jpeg','image/png','image/webp']}});
  return fn;
}
async function aiListModels(prov, key){
  if (prov === 'claude') {
    const {r, body} = await aiFetch('https://api.anthropic.com/v1/models?limit=100', {headers:{'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true'}});
    if (!r.ok) throw httpErr(prov, r, body);
    return (body.data || []).map(m=>m.id);
  }
  const {r, body} = await aiFetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', {headers:{'x-goog-api-key':key}});
  if (!r.ok) throw httpErr(prov, r, body);
  return (body.models || []).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent') && /gemini|gemma/.test(m.name)).map(m=>m.name.replace(/^models\//,''));
}
let aiDraft = null;
const AI_INFO = {
  gemini:{name:'Google Gemini', where:'Lấy key miễn phí ở <b>aistudio.google.com</b> → “Get API key”. Gói miễn phí có giới hạn số lượt mỗi phút/ngày; Google có thể dùng nội dung ở gói miễn phí để cải thiện sản phẩm.'},
  claude:{name:'Anthropic Claude', where:'Lấy key ở <b>console.anthropic.com</b> → API Keys. Phải nạp tiền trước; tính phí theo lượng chữ dùng, không nằm trong gói Claude Pro.'}};
function openAI(){
  const c = aiCfg(); aiDraft = JSON.parse(JSON.stringify(c));
  modal('AI · API key', `
    <div class="note">Key chỉ lưu trong trình duyệt của máy này. Key <b>không</b> nằm trong file sao lưu và chỉ được gửi tới máy chủ AI bạn chọn.</div>
    <div class="field"><label for="ai-prov">Dùng AI của</label><select id="ai-prov">
      <option value="gemini" ${c.provider==='gemini'?'selected':''}>Google Gemini — có gói miễn phí, giới hạn lượt dùng</option>
      <option value="claude" ${c.provider==='claude'?'selected':''}>Anthropic Claude — trả phí theo lượng dùng</option></select></div>
    <div class="field"><label for="ai-key">API key</label><input id="ai-key" type="password" autocomplete="off" spellcheck="false" placeholder="Dán key vào đây"><span class="help" id="ai-where"></span></div>
    <div class="grid2"><div class="field"><label for="ai-main">Model chính</label><input id="ai-main" list="ai-models" autocomplete="off" spellcheck="false"></div>
      <div class="field"><label for="ai-quick">Model nhanh</label><input id="ai-quick" list="ai-models" autocomplete="off" spellcheck="false"></div></div>
    <datalist id="ai-models"></datalist>
    <div style="font-size:12px;color:var(--muted);margin-top:-4px">Model chính dùng để nhắn tin; model nhanh dùng cho việc phụ (ghi chú, story, sổ sự thật). Bấm “Kiểm tra key” để xem danh sách model key của bạn dùng được.</div>
    <div class="note" id="ai-test" hidden></div>`,
    `<button class="btn danger" data-act="ai-clear">Xoá key</button><span class="sp"></span><button class="btn ghost" data-act="ai-test">Kiểm tra key</button><button class="btn" data-act="ai-save">Lưu</button>`);
  const fill = () => { const p = $('#ai-prov').value; $('#ai-key').value = aiDraft.keys[p] || ''; $('#ai-main').value = aiDraft.models[p].main; $('#ai-quick').value = aiDraft.models[p].quick; $('#ai-where').innerHTML = AI_INFO[p].where; $('#ai-models').innerHTML = ''; $('#ai-test').hidden = true; };
  const keep = () => { const p = aiDraft.provider; aiDraft.keys[p] = $('#ai-key').value.trim(); aiDraft.models[p] = {main:$('#ai-main').value.trim() || AI_DEF.models[p].main, quick:$('#ai-quick').value.trim() || AI_DEF.models[p].quick}; };
  $('#ai-prov').addEventListener('change', ()=>{ keep(); aiDraft.provider = $('#ai-prov').value; fill(); });
  aiDraft.provider = c.provider; fill();
  openAI.keep = keep;
}
async function aiTest(){
  openAI.keep(); const p = aiDraft.provider, key = aiDraft.keys[p], box = $('#ai-test'), btn = document.querySelector('[data-act=ai-test]');
  box.hidden = false;
  if (!key) { box.innerHTML = '<span style="color:var(--danger)">Chưa dán key.</span>'; return; }
  btn.disabled = true; box.textContent = 'Đang kiểm tra…';
  try {
    const ids = await aiListModels(p, key);
    $('#ai-models').innerHTML = ids.map(id=>`<option value="${esc(id)}">`).join('');
    const main = aiDraft.models[p].main, quick = aiDraft.models[p].quick;
    const miss = [main, quick].filter(m=>ids.length && !ids.includes(m));
    const saved = AI_MEM; AI_MEM = JSON.parse(JSON.stringify(aiDraft));
    let ok = false; try { const r = await aiCall('Trả lời đúng một chữ: ok', {modelTier:'default'}); ok = !!r.text; } finally { AI_MEM = saved; }
    box.innerHTML = `<b style="color:var(--ink)">Key dùng được.</b> ${ok ? `Model chính “${esc(main)}” đã trả lời thử.` : ''}${miss.length ? `<br><span style="color:var(--danger)">Không thấy model ${miss.map(esc).join(', ')} trong danh sách của key — hãy chọn model khác ở ô gợi ý.</span>` : ''}<br><small>${ids.length} model dùng được, gõ vào ô model để xem gợi ý.</small>`;
  } catch(e) { box.innerHTML = `<span style="color:var(--danger)">${esc(errText(e && e.code))}</span>`; }
  finally { btn.disabled = false; }
}
function aiSaveForm(){
  openAI.keep(); aiDraft.provider = $('#ai-prov').value; aiSave(aiDraft);
  S.sample = makeSample(); S.sampleState = S.sample ? 'ok' : 'none';
  closeModal(); render(); toast(S.sample ? `Đã lưu. Nhân vật sẽ trả lời bằng ${AI_INFO[aiDraft.provider].name}.` : 'Đã lưu — nhưng chưa có key nên nhân vật chưa trả lời được.');
}
function aiClear(){
  const c = aiCfg(); const p = $('#ai-prov').value; c.keys[p] = ''; aiSave(c); aiDraft.keys[p] = ''; $('#ai-key').value = '';
  S.sample = makeSample(); S.sampleState = S.sample ? 'ok' : 'none'; render(); toast('Đã xoá key khỏi trình duyệt này.');
}

/* ---------- boot ---------- */
(async function boot(){
  await Store.init();
  const data = await Store.load();
  if (data) {
    if (data.persona) S.persona = Object.assign(S.persona, data.persona);
    S.chars = (data.chars||[]).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    S.threads = data.threads||[];
    S.posts = data.posts||[];
  } else seed();
  migrate();
  pauseGap(S.persona.lastSeen || 0);
  render();
  S.sample = makeSample(); S.sampleState = S.sample ? 'ok' : 'none';
  render();
  const since = S.persona.lastSeen || 0;
  S.booted = true;
  touchSeen(true);
  checkAway(since);
  setTimeout(maybeRefreshNotes, 4000);
})();
</script>

</body>
